name: Bug Report
description: Report a bug.
title: "[BUG] "
labels: ["bug"]

body:
  - type: input
    id: version
    attributes:
      label: What version are you on?
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: What operating system are you using?
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce the issue?
      placeholder: Describe the steps to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information or screenshots
      description: Include anything else that might help us investigate.
    validations:
      required: false
