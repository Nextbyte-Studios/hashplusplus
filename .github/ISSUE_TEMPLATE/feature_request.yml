name: Feature Request
description: Suggest a new feature or improvement.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this feature solve?
      description: Explain what you'd like to be able to do.
      placeholder: I would like to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe your suggested feature
      description: How do you think it should work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any other solutions?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, examples, or anything else useful.
    validations:
      required: false
